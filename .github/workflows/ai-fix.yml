name: AI fix from issue

# Triggered when an issue is labeled `ai-fix`. Runs the Anthropic Claude Code
# Action to read the issue body, make changes on a fresh branch, and open a
# PR back to main. The PR is then gated by the existing ci.yml workflow.
#
# Setup needed once:
#   - Repo secret: ANTHROPIC_API_KEY  (Settings → Secrets and variables → Actions)
#   - Issue label: `ai-fix`            (gh label create ai-fix --color FBCA04 ...)
#
# To trigger from chat: agent calls `gh-issue` skill (or POSTs to GitHub API)
# with `{labels: ["ai-fix"]}`. Action picks it up within ~30 seconds.

on:
  issues:
    types: [labeled]

jobs:
  ai-fix:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # claude-code-action authenticates via OIDC; without id-token: write
      # the step exits 1 with "Could not fetch an OIDC token". GitHub's
      # default permissions block id-token, so we have to opt in explicitly
      # per workflow (granting it here is repo-scoped, not org-wide).
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code on the issue
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # show_full_output: print Claude's actual messages + tool calls to
          # the run log so we can see what it tried (vs. the censored default
          # which only shows the final result envelope).
          show_full_output: true
          # bypassPermissions: this is a sandboxed CI runner with no
          # privileged secrets beyond the auto-issued GITHUB_TOKEN; the
          # default permission mode blocks Bash invocations like
          # `pnpm install`, `pnpm run build`, and `git commit` that the
          # prompt below asks for.
          claude_args: >-
            --permission-mode bypassPermissions
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Task,TodoWrite"
          # The previous prompt was too gentle — Claude did 1 turn in 3.3s
          # and exited without any tool calls. Be explicit about the
          # required deliverable so it can't decide it's "done" without
          # producing a diff.
          prompt: |
            You are an autonomous coding agent working on the NanoClaw
            repository. You have been triggered by an `ai-fix` label being
            added to GitHub issue **#${{ github.event.issue.number }}**:

              Title: ${{ github.event.issue.title }}

            That is the ONE issue you must work on. Do not run
            `gh issue list` to "find" the issue — the workflow told you
            which one. Multiple ai-fix runs fire in parallel; if you pick
            from `gh issue list` you will collide with sibling runs and
            multiple branches end up targeting the same issue while
            others get nothing.

            Read the full body via `gh issue view ${{ github.event.issue.number }}`
            before making any code edits.

            The CI runner is Ubuntu, the working tree is checked out at
            HEAD of `main`, and `gh` CLI is pre-installed and pre-auth'd
            via `GITHUB_TOKEN` env var.

            Mandatory steps, in order:
              1. `gh issue view ${{ github.event.issue.number }}` — read
                 the full issue body. Use this issue number (referred to
                 as `<N>` below) in every subsequent step.
              2. Create a fresh branch off main:
                 `git checkout -b claude/issue-<N>-<short-slug>`
                 (branch name MUST start with `claude/issue-<N>-` so
                 notify-pr.yml picks it up and so we can map the branch
                 back to the triggering issue without ambiguity).
              3. Use Read/Glob/Grep to locate relevant files. Read
                 CLAUDE.md and CONTRIBUTING.md before editing.
              4. Make the smallest correct edit. No drive-by refactors.
              5. `pnpm install --frozen-lockfile && pnpm run build`. Fix
                 underlying errors, don't skip.
              6. `pnpm run format` — Prettier. CI gates on `format:check`,
                 so unformatted code = failed PR. Never skip this.
              7. `git add -A && git commit -m "fix: <short> (#<N>)" -m
                 "<body>"` — Conventional Commits, reference issue.
              8. `git push -u origin claude/issue-<N>-<short-slug>`
              9. `gh pr create --base main --title "fix: <short> (#<N>)"
                 --body "Closes #<N>. <details>" --draft=false`
              10. `gh issue comment <N> --body "PR opened: <url>"` so the
                 issue tracks the fix.

            If after honest investigation you conclude the change is
            genuinely impossible or already implemented, do step 6-9
            with a single-file diff at repo root: `ISSUE_<N>_NOTES.md`
            documenting why. Silent exits without a branch+PR are NOT
            an acceptable outcome — the entire purpose of this run is
            to produce a reviewable PR for issue #<N>.
